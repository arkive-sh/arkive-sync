syntax = "proto3";

package arkive.ipc;

enum Command {
  COMMAND_UNSPECIFIED = 0;
  STATUS = 1;
  STOP = 2;
  LOGIN = 3;
  LOGOUT = 4;
  SYNC_ADD = 5;
  SYNC_RUN = 6;
  SYNC_LIST = 7;
  SYNC_REMOVE = 8;
}

message SyncRoot {
  string id = 1;
  string path = 2;
  bool enabled = 3;
  string mode = 4;
}

message Request {
  uint32 protocol_version = 1;
  Command command = 2;
  string email = 3;
  string password = 4;
  string path = 5;
}

message Response {
  uint32 protocol_version = 1;
  bool ok = 2;
  string error = 3;
  string state = 4;
  uint32 sync_root_count = 5;
  bool authenticated = 6;
  bool vault_unlocked = 7;
  string email = 8;
  string sync_root_id = 9;
  string sync_root_path = 10;
  uint32 scanned_root_count = 11;
  repeated SyncRoot sync_roots = 12;
  uint32 synced_entry_count = 13;
}

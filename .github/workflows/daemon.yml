name: Daemon IPC

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon-smoke:
    name: daemon ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      ARKIVE_TEST_BASE_URL: https://c592-2407-d000-11-7833-acdf-deeb-f13d-bfc2.ngrok-free.app
      ARKIVE_LOGIN_EMAIL: ${{ secrets.ARKIVE_TEST_EMAIL }}
      ARKIVE_LOGIN_PASSWORD: ${{ secrets.ARKIVE_TEST_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Cache Windows dependencies
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
            C:\vcpkg\downloads
          key: windows-vcpkg-${{ hashFiles('CMakeLists.txt', '.github/workflows/daemon.yml') }}

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_BUILD_TYPE: release
        run: C:/vcpkg/vcpkg.exe install curl sqlite3 protobuf --triplet x64-windows

      - name: Install macOS protobuf
        if: runner.os == 'macOS'
        run: brew list protobuf >/dev/null 2>&1 || brew install protobuf

      - name: Configure daemon build
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure daemon build
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build daemon
        run: cmake --build build --target arkive-sync --config Release

      - name: Configure test server
        if: runner.os == 'macOS'
        run: ./build/arkive-sync set-base-url "$ARKIVE_TEST_BASE_URL"

      - name: Configure test server
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build\Release\arkive-sync.exe set-base-url $env:ARKIVE_TEST_BASE_URL

      - name: Verify login secrets
        if: runner.os == 'macOS'
        run: test -n "$ARKIVE_LOGIN_EMAIL" && test -n "$ARKIVE_LOGIN_PASSWORD"

      - name: Verify login secrets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ARKIVE_LOGIN_EMAIL) -or [string]::IsNullOrWhiteSpace($env:ARKIVE_LOGIN_PASSWORD)) {
            throw "ARKIVE_TEST_EMAIL and ARKIVE_TEST_PASSWORD secrets are required"
          }

      - name: Run daemon smoke
        if: runner.os == 'macOS'
        run: |
          ./build/arkive-sync daemon &
          pid=$!
          sleep 8
          ./build/arkive-sync login
          ./build/arkive-sync status
          root="$RUNNER_TEMP/arkive-sync-root"
          mkdir -p "$root"
          echo smoke > "$root/file.txt"
          add_output=$(./build/arkive-sync sync add "$root" 2>&1)
          echo "$add_output"
          root_id=$(echo "$add_output" | sed -n 's/.*id=\([^ ]*\).*/\1/p' | head -1)
          test -n "$root_id"
          list_output=$(./build/arkive-sync sync list 2>&1)
          echo "$list_output"
          echo "$list_output" | grep -Fq "$root"
          sync_output=$(./build/arkive-sync sync run 2>&1)
          echo "$sync_output"
          echo "$sync_output" | grep -Eq '[1-9][0-9]* remote entr(y|ies) available'
          pull_output=$(./build/arkive-sync sync pull 2>&1)
          echo "$pull_output"
          echo "$pull_output" | grep -Eq 'Pulled remote changes for [1-9][0-9]* sync root'
          ./build/arkive-sync sync remove "$root_id"
          post_remove_output=$(./build/arkive-sync sync list 2>&1)
          echo "$post_remove_output"
          echo "$post_remove_output" | grep -F "id=$root_id" | grep -Fq "enabled=false"
          ./build/arkive-sync daemon stop
          wait "$pid"

      - name: Run daemon smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\build\Release\arkive-sync.exe" -ArgumentList "daemon" -PassThru -NoNewWindow
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Daemon exited before IPC smoke commands ran with code $($process.ExitCode)"
          }
          & ".\build\Release\arkive-sync.exe" login
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & ".\build\Release\arkive-sync.exe" status
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $root = Join-Path $env:RUNNER_TEMP "arkive-sync-root"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Content -Path (Join-Path $root "file.txt") -Value "smoke"
          $addOutput = (& ".\build\Release\arkive-sync.exe" sync add $root 2>&1 | Out-String)
          $addOutput
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $rootId = [regex]::Match($addOutput, 'id=([^ ]+)').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($rootId)) {
            throw "sync add did not return a root id"
          }
          $listOutput = (& ".\build\Release\arkive-sync.exe" sync list 2>&1 | Out-String)
          $listOutput
          if ($LASTEXITCODE -ne 0 -or $listOutput -notmatch [regex]::Escape($root)) {
            throw "sync list did not contain the added root"
          }
          $syncOutput = (& ".\build\Release\arkive-sync.exe" sync run 2>&1 | Out-String)
          $syncOutput
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($syncOutput -notmatch '[1-9][0-9]* remote entr') {
            throw "sync run did not report a remote entry"
          }
          & ".\build\Release\arkive-sync.exe" sync pull
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & ".\build\Release\arkive-sync.exe" sync remove $rootId
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $postRemoveOutput = (& ".\build\Release\arkive-sync.exe" sync list 2>&1 | Out-String)
          $postRemoveOutput
          $disabledRootPattern = "id=$([regex]::Escape($rootId)).*path=$([regex]::Escape($root)).*enabled=false"
          if ($LASTEXITCODE -ne 0 -or $postRemoveOutput -notmatch $disabledRootPattern) {
            throw "sync remove did not disable the root"
          }
          & ".\build\Release\arkive-sync.exe" daemon stop
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) {
            exit $process.ExitCode
          }

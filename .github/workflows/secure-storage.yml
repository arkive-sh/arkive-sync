name: Platform Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  native-smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Build smoke test
        if: runner.os == 'macOS'
        run: >
          c++ -std=c++20 -Isrc
          tests/secure_storage_native_smoke.cpp
          src/platform/SecureStorage.cpp
          src/platform/macos/SecureStorage.cpp
          -framework CoreFoundation
          -framework Security
          -o secure-storage-smoke

      - name: Run smoke test
        if: runner.os == 'macOS'
        run: ./secure-storage-smoke

      - name: Build atomic writer smoke test
        if: runner.os == 'macOS'
        run: >
          c++ -std=c++20 -Isrc
          tests/atomic_file_writer_native_smoke.cpp
          src/platform/AtomicFileWriterFactory.cpp
          src/platform/macos/filewriter/MacosAtomicFileWriter.cpp
          src/helpers/Hex.cpp
          -o atomic-writer-smoke

      - name: Run atomic writer smoke test
        if: runner.os == 'macOS'
        run: ./atomic-writer-smoke

      - name: Build watcher smoke test
        if: runner.os == 'macOS'
        run: >
          c++ -std=c++20 -Isrc
          tests/watcher_native_smoke.cpp
          src/fs/FileWatcher.cpp
          src/fs/FileSnapshot.cpp
          src/platform/macos/watcher/FSEventsWatcher.cpp
          -framework CoreServices
          -o watcher-smoke

      - name: Run watcher smoke test
        if: runner.os == 'macOS'
        run: ./watcher-smoke

      - name: Build smoke test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /std:c++20 /EHsc /Isrc /c tests\secure_storage_native_smoke.cpp /Fo:secure_storage_native_smoke.obj
          cl /std:c++20 /EHsc /Isrc /c src\platform\SecureStorage.cpp /Fo:secure_storage_factory.obj
          cl /std:c++20 /EHsc /Isrc /c src\platform\windows\SecureStorage.cpp /Fo:secure_storage_windows.obj
          link secure_storage_native_smoke.obj secure_storage_factory.obj secure_storage_windows.obj Advapi32.lib /OUT:secure-storage-smoke.exe

      - name: Run smoke test
        if: runner.os == 'Windows'
        shell: cmd
        run: secure-storage-smoke.exe

      - name: Build atomic writer smoke test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /std:c++20 /EHsc /Isrc /c tests\atomic_file_writer_native_smoke.cpp /Fo:atomic_file_writer_native_smoke.obj
          cl /std:c++20 /EHsc /Isrc /c src\platform\AtomicFileWriterFactory.cpp /Fo:atomic_file_writer_factory.obj
          cl /std:c++20 /EHsc /Isrc /c src\platform\windows\filewriter\WindowsAtomicFileWriter.cpp /Fo:atomic_file_writer_windows.obj
          cl /std:c++20 /EHsc /Isrc /c src\helpers\Hex.cpp /Fo:hex.obj
          link atomic_file_writer_native_smoke.obj atomic_file_writer_factory.obj atomic_file_writer_windows.obj hex.obj /OUT:atomic-writer-smoke.exe

      - name: Run atomic writer smoke test
        if: runner.os == 'Windows'
        shell: cmd
        run: atomic-writer-smoke.exe

      - name: Build watcher smoke test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /std:c++20 /EHsc /Isrc /c tests\watcher_native_smoke.cpp /Fo:watcher_native_smoke.obj
          cl /std:c++20 /EHsc /Isrc /c src\fs\FileWatcher.cpp /Fo:file_watcher.obj
          cl /std:c++20 /EHsc /Isrc /c src\fs\FileSnapshot.cpp /Fo:file_snapshot.obj
          cl /std:c++20 /EHsc /Isrc /c src\platform\windows\watcher\ReadDirectoryChangesWatcher.cpp /Fo:read_directory_changes_watcher.obj
          link watcher_native_smoke.obj file_watcher.obj file_snapshot.obj read_directory_changes_watcher.obj /OUT:watcher-smoke.exe

      - name: Run watcher smoke test
        if: runner.os == 'Windows'
        shell: cmd
        run: watcher-smoke.exe

  daemon-build:
    name: daemon ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: C:/vcpkg/vcpkg.exe install curl sqlite3 --triplet x64-windows

      - name: Configure daemon build
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure daemon build
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build daemon
        run: cmake --build build --target arkive-sync --config Release

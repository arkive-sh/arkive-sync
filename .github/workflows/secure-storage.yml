name: Secure Storage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  native-smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build smoke test
        if: runner.os == 'macOS'
        run: >
          c++ -std=c++20 -Isrc
          tests/secure_storage_native_smoke.cpp
          src/platform/SecureStorage.cpp
          src/platform/macos/SecureStorage.cpp
          -framework CoreFoundation
          -framework Security
          -o secure-storage-smoke

      - name: Run smoke test
        if: runner.os == 'macOS'
        run: ./secure-storage-smoke

      - name: Build smoke test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /std:c++20 /EHsc /Isrc tests\secure_storage_native_smoke.cpp src\platform\SecureStorage.cpp src\platform\windows\SecureStorage.cpp Advapi32.lib /Fe:secure-storage-smoke.exe

      - name: Run smoke test
        if: runner.os == 'Windows'
        shell: cmd
        run: secure-storage-smoke.exe

name: Secure Storage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  native-smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Build smoke test
        if: runner.os == 'macOS'
        run: >
          c++ -std=c++20 -Isrc
          tests/secure_storage_native_smoke.cpp
          src/platform/SecureStorage.cpp
          src/platform/macos/SecureStorage.cpp
          -framework CoreFoundation
          -framework Security
          -o secure-storage-smoke

      - name: Run smoke test
        if: runner.os == 'macOS'
        run: ./secure-storage-smoke

      - name: Build smoke test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /std:c++20 /EHsc /Isrc /c tests\secure_storage_native_smoke.cpp /Fo:secure_storage_native_smoke.obj
          cl /std:c++20 /EHsc /Isrc /c src\platform\SecureStorage.cpp /Fo:secure_storage_factory.obj
          cl /std:c++20 /EHsc /Isrc /c src\platform\windows\SecureStorage.cpp /Fo:secure_storage_windows.obj
          link secure_storage_native_smoke.obj secure_storage_factory.obj secure_storage_windows.obj Advapi32.lib /OUT:secure-storage-smoke.exe

      - name: Run smoke test
        if: runner.os == 'Windows'
        shell: cmd
        run: secure-storage-smoke.exe
